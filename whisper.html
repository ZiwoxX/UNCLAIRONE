<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROYAL WHISPER | Virtual Voice Board</title>
    <link rel="icon" type="image/svg+xml" href="image/unclairone.png" /> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #061619;
            --bg-card: rgba(12, 43, 48, 0.8);
            --c-gold-1: #fcf6ba;
            --c-gold-2: #bf953f;
            --font-royal: 'Cinzel Decorative', cursive;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-dark);
            color: white;
            font-family: var(--font-body);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            z-index: 10;
        }

        .glass-card {
            background: var(--bg-card);
            border: 1px solid rgba(191, 149, 63, 0.3);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            text-align: center;
            margin-bottom: 30px;
        }

        h1 { font-family: var(--font-royal); color: var(--c-gold-1); margin-bottom: 10px; }

        /* Recorder Styles */
        .rec-btn {
            width: 70px; height: 70px; border-radius: 50%; border: none;
            font-size: 1.5rem; cursor: pointer; transition: 0.3s;
            background: #e74c3c; color: white;
        }
        .rec-btn.active { animation: pulse 1.5s infinite; background: #c0392b; }
        @keyframes pulse { 0% {box-shadow: 0 0 0 0 rgba(231,76,60,0.7);} 70% {box-shadow: 0 0 0 15px rgba(231,76,60,0);} 100% {box-shadow: 0 0 0 0 rgba(231,76,60,0);}}

        .btn-gold {
            background: var(--c-gold-2); color: black; border: none;
            padding: 10px 20px; border-radius: 50px; font-weight: bold;
            cursor: pointer; margin-top: 15px; display: none;
        }

        /* List Styles */
        .whisper-list { width: 100%; display: flex; flex-direction: column; gap: 15px; }
        .whisper-item {
            background: rgba(255,255,255,0.05);
            padding: 15px; border-radius: 15px;
            display: flex; align-items: center; gap: 15px;
            border-left: 4px solid var(--c-gold-2);
        }
        audio { height: 35px; flex-grow: 1; }
        .time { font-size: 0.7rem; color: var(--c-gold-1); }

        .loader { border: 3px solid #f3f3f3; border-top: 3px solid var(--c-gold-2); border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <div class="glass-card">
            <h1>ROYAL WHISPER</h1>
            <p style="font-size: 0.9rem; color: #aaa; margin-bottom: 20px;">Rekam suaramu, biarkan dunia mendengar.</p>
            
            <button id="recordBtn" class="rec-btn"><i class="fas fa-microphone"></i></button>
            <p id="status" style="margin-top: 15px; font-style: italic;">Klik untuk merekam</p>
            
            <div id="previewArea" style="display: none; margin-top: 20px;">
                <audio id="audioPreview" controls></audio>
                <br>
                <button id="uploadBtn" class="btn-gold"><i class="fas fa-cloud-upload-alt"></i> Upload ke Board</button>
            </div>
        </div>

        <h2 style="font-family: var(--font-royal); font-size: 1.2rem; color: var(--c-gold-2); margin-bottom: 15px;">PUBLIC BOARD</h2>
        <div id="whisperList" class="whisper-list">
            <p style="text-align: center; color: #666;">Memuat suara...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        // === 1. MASUKKAN KONFIGURASI FIREBASE KAMU DI SINI ===
        const firebaseConfig = {
      apiKey: "AIzaSyAnouQgMTahiA0R3pyKb6n_qHYFhX4tfgU",
      authDomain: "website-25711.firebaseapp.com",
      databaseURL: "https://website-25711-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "website-25711",
      storageBucket: "website-25711.appspot.com",
      messagingSenderId: "38660762483",
      appId: "1:38660762483:web:8f0fa0be46a2e901ceb306",
      measurementId: "G-6VB4PRBFYV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // Logic Recorder
        let mediaRecorder;
        let audioChunks = [];
        const recordBtn = document.getElementById('recordBtn');
        const status = document.getElementById('status');
        const uploadBtn = document.getElementById('uploadBtn');
        const audioPreview = document.getElementById('audioPreview');
        const previewArea = document.getElementById('previewArea');
        let audioBlob;

        recordBtn.onclick = async () => {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                recordBtn.classList.remove('active');
                status.innerText = "Rekaman selesai.";
            } else {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                    audioPreview.src = URL.createObjectURL(audioBlob);
                    previewArea.style.display = "block";
                    uploadBtn.style.display = "inline-block";
                };

                mediaRecorder.start();
                recordBtn.classList.add('active');
                status.innerText = "🔴 Sedang merekam...";
            }
        };

        // Upload ke Firebase
        uploadBtn.onclick = async () => {
            uploadBtn.disabled = true;
            uploadBtn.innerHTML = `<span class="loader"></span> Mengirim...`;

            try {
                const fileName = `whispers/${Date.now()}.mp3`;
                const storageRef = ref(storage, fileName);
                
                // 1. Upload file ke Storage
                await uploadBytes(storageRef, audioBlob);
                const downloadURL = await getDownloadURL(storageRef);

                // 2. Simpan link ke Firestore
                await addDoc(collection(db, "whispers"), {
                    url: downloadURL,
                    timestamp: serverTimestamp()
                });

                alert("Berhasil terkirim!");
                previewArea.style.display = "none";
                status.innerText = "Klik untuk merekam";
            } catch (e) {
                console.error(e);
                alert("Gagal upload: " + e.message);
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.innerHTML = `<i class="fas fa-cloud-upload-alt"></i> Upload ke Board`;
            }
        };

        // Ambil data Realtime dari Firestore
        const q = query(collection(db, "whispers"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            const list = document.getElementById('whisperList');
            list.innerHTML = "";
            if(snapshot.empty) list.innerHTML = "<p style='text-align:center; color:#555;'>Belum ada suara.</p>";
            
            snapshot.forEach((doc) => {
                const data = doc.data();
                const date = data.timestamp ? new Date(data.timestamp.seconds * 1000).toLocaleString('id-ID') : "Baru saja";
                
                list.innerHTML += `
                    <div class="whisper-item">
                        <div style="color:var(--c-gold-2)"><i class="fas fa-play-circle fa-2x"></i></div>
                        <div style="flex-grow:1">
                            <audio src="${data.url}" controls></audio>
                            <div class="time">${date}</div>
                        </div>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
