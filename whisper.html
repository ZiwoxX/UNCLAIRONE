<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiw Kiw | UNCLAIRONE</title>
    <link rel="icon" type="image/svg+xml" href="image/unclairone.png" /> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;400;600&family=Noto+Sans+Buginese&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <style>
        :root {
            --main-bg-gradient: linear-gradient(180deg, #0c2b30 0%, #061424 100%);
            --c-void: #061424; 
            --c-depth: #113038; 
            --c-gold-1: #bf953f;
            --c-gold-2: #fcf6ba;
            --c-gold-3: #b38728;
            --c-maroon: #8c2131;
            --glass-bg: rgba(12, 43, 48, 0.75);
            --glass-border: 1px solid rgba(191, 149, 63, 0.3);
            --font-royal: 'Cinzel Decorative', cursive;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--c-void);
            background-image: 
                linear-gradient(30deg, rgba(255,255,255,0.02) 12%, transparent 12.5%, transparent 87%, rgba(255,255,255,0.02) 87.5%, rgba(255,255,255,0.02)),
                linear-gradient(150deg, rgba(255,255,255,0.02) 12%, transparent 12.5%, transparent 87%, rgba(255,255,255,0.02) 87.5%, rgba(255,255,255,0.02)),
                var(--main-bg-gradient);
            background-size: 60px 100px, 60px 100px, cover;
            background-position: 0 0, 0 0, 0 0;
            background-attachment: fixed;
            color: white;
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Phinisi Background Decoration */
        .phinisi-bg {
            position: fixed;
            bottom: -10%;
            right: -10%;
            width: 50%;
            opacity: 0.05;
            pointer-events: none;
            filter: invert(1);
            z-index: 0;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            z-index: 10;
            position: relative;
        }

        /* --- RECORDER CARD --- */
        .recorder-card {
            background: linear-gradient(145deg, rgba(12, 43, 48, 0.9), rgba(6, 20, 36, 0.95));
            border: var(--glass-border);
            border-radius: 25px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
        }
        .recorder-card::before {
            content: 'ᨑᨚᨐᨒᨛ ᨓᨗᨔᨛᨄᨛᨑᨛ';
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            font-family: 'Noto Sans Buginese', serif; font-size: 3rem; color: var(--c-gold-1); opacity: 0.05; pointer-events: none;
        }

        h1 { font-family: var(--font-royal); color: var(--c-gold-1); font-size: 2.2rem; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); cursor: pointer; user-select: none; }
        
        .rec-btn-wrapper { position: relative; width: 100px; height: 100px; margin: 30px auto; }
        .rec-ring { position: absolute; inset: -10px; border: 2px dashed var(--c-gold-3); border-radius: 50%; animation: rotate-slow 20s linear infinite; opacity: 0.5; }
        .rec-btn {
            width: 100%; height: 100%; border-radius: 50%; border: none;
            font-size: 2rem; cursor: pointer; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: linear-gradient(45deg, #e74c3c, #c0392b); color: white;
            box-shadow: 0 10px 30px rgba(231, 76, 60, 0.4); position: relative; z-index: 2;
        }
        .rec-btn:hover { transform: scale(1.05); }
        .rec-btn.recording { animation: pulse-red 1.5s infinite; background: linear-gradient(45deg, #c0392b, #a93226); }
        @keyframes pulse-red { 0% {box-shadow: 0 0 0 0 rgba(231,76,60,0.7);} 70% {box-shadow: 0 0 0 25px rgba(231,76,60,0);} 100% {box-shadow: 0 0 0 0 rgba(231,76,60,0);}}
        @keyframes rotate-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .btn-gold {
            background: linear-gradient(to right, var(--c-gold-1), var(--c-gold-3)); color: black; border: none;
            padding: 12px 35px; border-radius: 50px; font-weight: bold; font-family: var(--font-royal); letter-spacing: 1px;
            cursor: pointer; margin-top: 25px; display: none; box-shadow: 0 5px 20px rgba(191, 149, 63, 0.4);
            transition: 0.3s;
        }
        .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(191, 149, 63, 0.6); color: #fff; }
        .btn-gold:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        /* --- PUBLIC BOARD --- */
        .board-title {
            font-family: var(--font-royal); font-size: 1.5rem; color: var(--c-gold-2); 
            margin: 40px 0 20px; text-align: center; position: relative; display: flex; align-items: center; justify-content: center; gap: 15px;
        }
        .board-title::before, .board-title::after { content: ''; height: 1px; background: var(--c-gold-3); flex: 1; opacity: 0.5; }

        .whisper-list { width: 100%; display: flex; flex-direction: column; gap: 15px; max-height: 400px; overflow-y: auto; padding-right: 5px; }
        .whisper-item {
            background: rgba(12, 43, 48, 0.5);
            border: 1px solid rgba(191, 149, 63, 0.2); border-radius: 15px; padding: 15px 20px;
            display: flex; align-items: center; gap: 20px; transition: 0.3s; position: relative;
        }
        .whisper-item:hover { background: rgba(20, 50, 60, 0.8); border-color: var(--c-gold-1); transform: translateX(5px); }
        .play-icon-wrapper {
            width: 50px; height: 50px; background: linear-gradient(45deg, var(--c-gold-1), var(--c-gold-3));
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; color: #000; cursor: pointer; box-shadow: 0 5px 15px rgba(191, 149, 63, 0.3); transition: 0.3s;
        }
        .play-icon-wrapper:hover { transform: scale(1.1); color: #fff; }
        .play-icon-wrapper.playing { animation: pulse-gold 1.5s infinite; background: #fff; color: var(--c-gold-3); }
        @keyframes pulse-gold { 0% {box-shadow: 0 0 0 0 rgba(191,149,63,0.7);} 70% {box-shadow: 0 0 0 15px rgba(191,149,63,0);} 100% {box-shadow: 0 0 0 0 rgba(191,149,63,0);}}

        .time { font-size: 0.7rem; color: var(--c-gold-1); margin-top: 5px; opacity: 0.8; display: flex; align-items: center; gap: 5px; }
        .btn-delete-admin {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            background: rgba(255, 0, 0, 0.2); color: #ff5555; border: none; width: 30px; height: 30px; border-radius: 50%;
            cursor: pointer; display: none; align-items: center; justify-content: center; transition: 0.3s;
        }
        body.admin-mode .btn-delete-admin { display: flex; }
        .btn-delete-admin:hover { background: #ff5555; color: white; }

        .back-btn {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0,0,0,0.3); border: 1px solid var(--c-gold-3); color: var(--c-gold-1);
            padding: 8px 15px; border-radius: 30px; text-decoration: none; font-size: 0.8rem;
            display: flex; align-items: center; gap: 8px; transition: 0.3s;
        }
        .back-btn:hover { background: var(--c-gold-1); color: #000; }

        /* Admin Login Modal */
        #adminModal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 999;
            display: none; justify-content: center; align-items: center;
        }
        .admin-box {
            background: var(--c-depth); border: 1px solid var(--c-gold-3); padding: 30px; border-radius: 20px; text-align: center;
        }
        .admin-input {
            background: rgba(0,0,0,0.3); border: 1px solid var(--c-gold-3); color: var(--c-gold-1);
            padding: 10px; border-radius: 10px; margin: 20px 0; text-align: center; letter-spacing: 3px; outline: none;
        }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #000; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Scrollbar Mewah */
        .whisper-list::-webkit-scrollbar { width: 5px; }
        .whisper-list::-webkit-scrollbar-thumb { background: var(--c-gold-3); border-radius: 10px; }
    </style>
</head>
<body>

    <img src="image/phinisi.png" class="phinisi-bg" alt="Phinisi">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> KEMBALI</a>

    <div class="main-container">
        <div class="recorder-card">
            <h1 id="adminTrigger">Voice Record</h1>
            <p style="font-size: 0.9rem; color: #aaa; margin-bottom: 30px; font-family: 'Cormorant Garamond'; font-style: italic;">"Jangan toksis temang-temang"</p>
            
            <div class="rec-btn-wrapper">
                <div class="rec-ring"></div>
                <button id="recordBtn" class="rec-btn"><i class="fas fa-microphone"></i></button>
            </div>
            <p id="status" style="margin-top: 15px; font-style: italic; color: var(--c-gold-2);">Klik mikrofon untuk merekam</p>
            
            <div id="previewArea" style="display: none; margin-top: 25px;">
                <audio id="audioPreview" controls style="display:none;"></audio> 
                <button id="btnPlayPreview" style="background:transparent; border:1px solid var(--c-gold-3); color:var(--c-gold-1); width:40px; height:40px; border-radius:50%; cursor:pointer; margin-right:10px;"><i class="fas fa-play"></i></button>
                <span style="font-size:0.8rem; color:#aaa;">Preview Rekaman</span>
                <br>
                <button id="uploadBtn" class="btn-gold"><i class="fas fa-cloud-upload-alt"></i> KIRIM KE BOARD</button>
            </div>
        </div>

        <div class="board-title">PUBLIC BOARD</div>
        <div id="whisperList" class="whisper-list">
            <p style="text-align: center; color: #666; margin-top: 20px;"><span class="loader" style="border-top-color: var(--c-gold-1);"></span> Memuat suara...</p>
        </div>
    </div>

    <div id="adminModal">
        <div class="admin-box">
            <h3 style="font-family: var(--font-royal); color: var(--c-gold-1);">ADMIN ACCESS</h3>
            <input type="password" id="adminPassInput" class="admin-input" placeholder="••••••">
            <br>
            <button onclick="checkAdmin()" class="btn-gold" style="display:inline-block; padding:8px 25px; font-size:0.8rem;">MASUK</button>
            <button onclick="closeAdmin()" style="background:transparent; border:none; color:#aaa; margin-top:10px; cursor:pointer; display:block; width:100%;">Batal</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        // === 1. CONFIG FIREBASE (GANTI DENGAN PUNYAMU!) ===
        const firebaseConfig = {
            apiKey: "AIzaSyAnouQgMTahiA0R3pyKb6n_qHYFhX4tfgU",
            authDomain: "website-25711.firebaseapp.com",
            projectId: "website-25711",
            storageBucket: "website-25711.appspot.com",
            messagingSenderId: "38660762483",
            appId: "1:38660762483:web:8f0fa0be46a2e901ceb306"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const ADMIN_PW = "admin123"; // Password Admin

        // Elements & Vars
        let mediaRecorder; let audioChunks = []; let audioBlob; let currentPlaying = null;
        const recordBtn = document.getElementById('recordBtn');
        const status = document.getElementById('status');
        const uploadBtn = document.getElementById('uploadBtn');
        const audioPreview = document.getElementById('audioPreview');
        const btnPlayPreview = document.getElementById('btnPlayPreview');
        const previewArea = document.getElementById('previewArea');

        // --- RECORDER LOGIC ---
        recordBtn.onclick = async () => {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                recordBtn.classList.remove('recording');
                recordBtn.innerHTML = '<i class="fas fa-microphone"></i>';
                status.innerText = "Selesai! Dengarkan preview atau rekam ulang.";
            } else {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        audioPreview.src = URL.createObjectURL(audioBlob);
                        previewArea.style.display = "block";
                        uploadBtn.style.display = "inline-block";
                        btnPlayPreview.innerHTML = '<i class="fas fa-play"></i>';
                    };

                    mediaRecorder.start();
                    recordBtn.classList.add('recording');
                    recordBtn.innerHTML = '<i class="fas fa-stop"></i>';
                    status.innerText = "Sedang Merekam... (Bicara sekarang)";
                    status.style.color = "#e74c3c";
                    previewArea.style.display = "none";
                } catch (err) {
                    alert("Gagal akses mikrofon. Pastikan izin diberikan!");
                }
            }
        };

        // Preview Play Button
        btnPlayPreview.onclick = () => {
            if(audioPreview.paused) {
                audioPreview.play(); btnPlayPreview.innerHTML = '<i class="fas fa-pause"></i>';
            } else {
                audioPreview.pause(); btnPlayPreview.innerHTML = '<i class="fas fa-play"></i>';
            }
        };
        audioPreview.onended = () => btnPlayPreview.innerHTML = '<i class="fas fa-play"></i>';

        // --- UPLOAD LOGIC ---
        uploadBtn.onclick = async () => {
            if(!audioBlob) return;
            uploadBtn.disabled = true;
            uploadBtn.innerHTML = `<span class="loader"></span> Mengirim...`;

            try {
                const fileName = `whispers/${Date.now()}.mp3`;
                const storageRef = ref(storage, fileName);
                await uploadBytes(storageRef, audioBlob);
                const downloadURL = await getDownloadURL(storageRef);

                await addDoc(collection(db, "whispers"), {
                    url: downloadURL,
                    storagePath: fileName, // Simpan path untuk fitur hapus
                    timestamp: serverTimestamp()
                });

                alert("Terkirim! Suaramu sudah ada di Board.");
                previewArea.style.display = "none";
                status.innerText = "Klik mikrofon untuk merekam lagi";
                status.style.color = "var(--c-gold-2)";
            } catch (e) {
                console.error(e);
                alert("Gagal kirim. Cek koneksi atau Firebase Rules.");
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.innerHTML = `<i class="fas fa-cloud-upload-alt"></i> KIRIM KE BOARD`;
            }
        };

        // --- REALTIME BOARD LOGIC ---
        const q = query(collection(db, "whispers"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            const list = document.getElementById('whisperList');
            list.innerHTML = "";
            if(snapshot.empty) {
                list.innerHTML = "<p style='text-align:center; color:#555; margin-top:20px;'>Belum ada suara. Jadilah yang pertama!</p>";
                return;
            }
            
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                const date = data.timestamp ? new Date(data.timestamp.seconds * 1000).toLocaleString('id-ID', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : "Baru saja";
                
                list.innerHTML += `
                    <div class="whisper-item">
                        <div id="btn-${id}" class="play-icon-wrapper" onclick="playAudio('${id}', '${data.url}')">
                            <i class="fas fa-play"></i>
                        </div>
                        <div style="flex-grow:1">
                            <div style="font-family:var(--font-royal); color:var(--c-gold-1); font-size:0.9rem;">Pesan Suara</div>
                            <div class="time"><i class="far fa-clock"></i> ${date}</div>
                        </div>
                        <button class="btn-delete-admin" onclick="deleteWhisper('${id}', '${data.storagePath}')">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                `;
            });
        });

        // --- AUDIO PLAYER CONTROLLER ---
        window.playAudio = (id, url) => {
            const btn = document.getElementById(`btn-${id}`);
            
            // Stop yang sedang main (jika ada dan beda)
            if(currentPlaying && currentPlaying.id !== id) {
                currentPlaying.audio.pause();
                document.getElementById(`btn-${currentPlaying.id}`).classList.remove('playing');
                document.getElementById(`btn-${currentPlaying.id}`).innerHTML = '<i class="fas fa-play"></i>';
            }

            if(currentPlaying && currentPlaying.id === id) {
                // Pause diri sendiri
                currentPlaying.audio.pause();
                btn.classList.remove('playing');
                btn.innerHTML = '<i class="fas fa-play"></i>';
                currentPlaying = null;
            } else {
                // Play baru
                const audio = new Audio(url);
                audio.play();
                btn.classList.add('playing');
                btn.innerHTML = '<i class="fas fa-pause"></i>';
                currentPlaying = { id, audio };
                
                audio.onended = () => {
                    btn.classList.remove('playing');
                    btn.innerHTML = '<i class="fas fa-play"></i>';
                    currentPlaying = null;
                };
            }
        };

        // --- ADMIN LOGIC (SECRET TRIGGER) ---
        let adminTapCount = 0;
        document.getElementById('adminTrigger').onclick = () => {
            adminTapCount++;
            if(adminTapCount === 5) {
                document.getElementById('adminModal').style.display = 'flex';
                adminTapCount = 0;
            }
        };

        window.checkAdmin = () => {
            if(document.getElementById('adminPassInput').value === ADMIN_PW) {
                document.body.classList.add('admin-mode');
                closeAdmin();
                alert("Mode Admin Aktif. Tombol hapus muncul.");
            } else {
                alert("Password Salah!");
            }
        };
        window.closeAdmin = () => document.getElementById('adminModal').style.display = 'none';

        // Hapus Data & File dari Firebase
        window.deleteWhisper = async (docId, storagePath) => {
            if(!confirm("Yakin hapus pesan suara ini permanen?")) return;
            try {
                // 1. Hapus dari Firestore
                await deleteDoc(doc(db, "whispers", docId));
                // 2. Hapus file dari Storage (jika path ada)
                if(storagePath) await deleteObject(ref(storage, storagePath));
                alert("Berhasil dihapus.");
            } catch(e) {
                alert("Gagal hapus: " + e.message);
            }
        };
    </script>
</body>
</html>
