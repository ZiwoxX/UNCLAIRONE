  <style>
    /* === CORE STYLE === */
    :root {
        --main-bg: #0c2b30;
        --c-void: #061424; 
        --c-gold-1: #bf953f;
        --c-gold-2: #fcf6ba;
        --c-gold-3: #b38728;
        --c-maroon: #8c2131; 
        --glass-bg: rgba(12, 43, 48, 0.75);
        --glass-border: 1px solid rgba(191, 149, 63, 0.3);
        --font-main: 'Plus Jakarta Sans', sans-serif;
        --font-header: 'Cinzel Decorative', cursive;
        --font-serif: 'Cormorant Garamond', serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }

    body {
        background-color: var(--c-void);
        background-image: 
            radial-gradient(circle at 50% 0%, #1a3c45 0%, transparent 60%),
            linear-gradient(180deg, #0c2b30 0%, #02050a 100%);
        color: #e2e8f0;
        font-family: var(--font-main);
        min-height: 100vh;
        overflow-x: hidden;
        padding-bottom: 100px; 
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--c-void); }
    ::-webkit-scrollbar-thumb { background: var(--c-gold-3); border-radius: 10px; }

    /* DEKORASI BACKGROUND */
    .royal-pattern {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23bf953f' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        z-index: -1; pointer-events: none;
    }

    /* HEADER */
    .header-area {
        text-align: center; padding: 60px 20px 30px;
        position: relative; z-index: 2;
    }
    .header-title {
        font-family: var(--font-header); font-size: 2.5rem;
        background: linear-gradient(to right, var(--c-gold-2), var(--c-gold-1), var(--c-gold-3));
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        margin-bottom: 5px; filter: drop-shadow(0 0 15px rgba(191,149,63,0.3));
    }
    .header-subtitle {
        font-family: var(--font-serif); font-size: 1.2rem; color: #aaa; letter-spacing: 2px;
        font-style: italic;
    }

    /* NAV BACK */
    .btn-back {
        position: absolute; top: 30px; left: 20px;
        color: var(--c-gold-1); font-size: 1.5rem; cursor: pointer;
        background: rgba(0,0,0,0.3); width: 45px; height: 45px;
        border-radius: 50%; display: flex; align-items: center; justify-content: center;
        border: 1px solid var(--c-gold-3); transition: 0.3s;
        text-decoration: none; z-index: 10;
    }
    .btn-back:hover { background: var(--c-gold-1); color: #000; transform: scale(1.1); }

    /* === SPOTLIGHT SECTION (NEXT BIRTHDAY) === */
    .spotlight-container {
        padding: 0 20px; display: flex; justify-content: center; margin-bottom: 50px;
    }
    .royal-card {
        background: rgba(12, 43, 48, 0.4);
        border: 1px solid var(--c-gold-1);
        border-radius: 20px; padding: 2px;
        width: 100%; max-width: 500px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        position: relative; overflow: hidden;
    }
    .royal-card-inner {
        background: linear-gradient(160deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.6) 100%);
        backdrop-filter: blur(10px); border-radius: 18px; padding: 30px;
        text-align: center; position: relative; z-index: 1;
    }
    .royal-card::before {
        content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
        background: linear-gradient(45deg, transparent, rgba(255,215,0,0.1), transparent);
        transform: rotate(45deg); animation: shine 6s infinite; pointer-events: none;
    }
    
    .crown-icon { font-size: 2rem; color: var(--c-gold-1); margin-bottom: 10px; filter: drop-shadow(0 0 10px var(--c-gold-3)); }
    .spotlight-label { font-family: var(--font-main); font-size: 0.8rem; letter-spacing: 3px; color: var(--c-gold-2); text-transform: uppercase; margin-bottom: 15px; }
    
    .spotlight-img-box {
        width: 130px; height: 130px; margin: 0 auto 20px; position: relative;
    }
    .spotlight-img {
        width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
        border: 3px solid var(--c-gold-1); box-shadow: 0 0 25px rgba(191,149,63,0.4);
    }
    /* Zodiak removed here */

    .spotlight-name { font-family: var(--font-header); font-size: 1.8rem; color: #fff; margin-bottom: 5px; }
    .spotlight-date { font-family: var(--font-serif); font-size: 1.3rem; color: var(--c-gold-2); font-style: italic; }
    
    .countdown-box {
        display: flex; justify-content: center; gap: 10px; margin: 20px 0;
    }
    .cd-unit { background: rgba(0,0,0,0.4); padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); min-width: 60px; }
    .cd-num { display: block; font-size: 1.2rem; font-weight: bold; color: var(--c-gold-1); }
    .cd-txt { font-size: 0.6rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }

    .btn-celebrate {
        background: linear-gradient(45deg, var(--c-maroon), #50131d);
        color: #fff; border: 1px solid var(--c-gold-3); padding: 10px 25px;
        border-radius: 50px; font-family: var(--font-header); font-size: 1rem;
        cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(140, 33, 49, 0.4);
    }
    .btn-celebrate:active { transform: scale(0.95); }

    /* === SEARCH BAR === */
    .search-wrapper {
        max-width: 600px; margin: 0 auto 40px; padding: 0 20px; position: relative;
    }
    .search-input {
        width: 100%; padding: 15px 50px 15px 20px;
        background: rgba(255,255,255,0.05); border: 1px solid rgba(191,149,63,0.3);
        border-radius: 12px; color: #fff; font-family: var(--font-main);
        transition: 0.3s; backdrop-filter: blur(5px);
    }
    .search-input:focus { border-color: var(--c-gold-1); background: rgba(255,255,255,0.1); }
    .search-icon { position: absolute; right: 35px; top: 50%; transform: translateY(-50%); color: var(--c-gold-3); }

    /* === LIST GRID === */
    .bday-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 20px; padding: 0 20px; max-width: 1200px; margin: 0 auto;
    }

    .card-student {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 15px; padding: 25px 15px; /* Padding ditambah sedikit agar seimbang */
        text-align: center; position: relative;
        transition: transform 0.3s, box-shadow 0.3s;
        backdrop-filter: blur(5px);
    }
    .card-student:hover {
        border-color: var(--c-gold-3);
        box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }
    
    .cs-img {
        width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
        margin: 0 auto 15px; border: 2px solid rgba(255,255,255,0.2);
        transition: 0.3s;
    }
    .card-student:hover .cs-img { border-color: var(--c-gold-1); transform: scale(1.05); }

    .cs-name { font-family: var(--font-header); font-size: 0.95rem; color: #e2e8f0; margin-bottom: 8px; height: 40px; display: flex; align-items: center; justify-content: center; overflow: hidden; line-height: 1.2; }
    .cs-date { font-family: var(--font-serif); font-size: 1rem; color: var(--c-gold-1); font-weight: bold; }
    
    /* MONTH SEPARATOR */
    .month-separator {
        grid-column: 1 / -1; margin: 30px 0 10px; padding-bottom: 10px;
        border-bottom: 1px solid rgba(191,149,63,0.2);
        display: flex; align-items: center; gap: 10px;
    }
    .ms-text { font-family: var(--font-header); font-size: 1.5rem; color: var(--c-gold-2); }
    .ms-line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--c-gold-3), transparent); }

    .dock-placeholder { height: 80px; }

    @keyframes shine { 0% { left: -100%; } 100% { left: 200%; } }

    @media (max-width: 480px) {
        .header-title { font-size: 2rem; }
        .bday-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .cs-img { width: 60px; height: 60px; }
        .cs-name { font-size: 0.8rem; }
    }
  </style>
</head>

    // --- 2. INIT & RENDER ---
    let sortedStudents = [];

    function init() {
        const today = new Date();
        const currentYear = today.getFullYear();

        sortedStudents = students.map(s => {
            if(!s.birthDate) return null;
            const [m, d] = s.birthDate.split('-').map(Number);
            let nextDate = new Date(currentYear, m - 1, d);
            if (nextDate < today.setHours(0,0,0,0)) nextDate.setFullYear(currentYear + 1);
            
            // Logic Zodiak dihapus disini
            return { ...s, m, d, nextDate };
        }).filter(Boolean);

        renderSpotlight();
        renderGrid(sortedStudents.sort((a,b) => (a.m - b.m) || (a.d - b.d)));

        // Init Tilt Effect
        VanillaTilt.init(document.querySelectorAll(".card-student"), {
            max: 15, speed: 400, glare: true, "max-glare": 0.2
        });
    }

                <img src="${star.photo}" class="spotlight-img">
            </div>
            <h2 class="spotlight-name">${star.name}</h2>
            <div class="spotlight-date">${star.d} ${monthNames[star.m-1]}</div>
            
            <div class="countdown-box" id="cdBox">
                <div class="cd-unit"><span class="cd-num" id="d">0</span><span class="cd-txt">Hari</span></div>
                <div class="cd-unit"><span class="cd-num" id="h">0</span><span class="cd-txt">Jam</span></div>
                <div class="cd-unit"><span class="cd-num" id="m">0</span><span class="cd-txt">Menit</span></div>
                <div class="cd-unit"><span class="cd-num" id="s">0</span><span class="cd-txt">Detik</span></div>
            </div>

            <button class="btn-celebrate" onclick="fireConfetti()">
                <i class="fas fa-gift"></i> RAYAKAN
            </button>
        `;

        startTimer(star.nextDate);
    }

    function startTimer(target) {
        function update() {
            const now = new Date();
            const diff = target - now;
            
            if(diff <= 0) {
                document.getElementById('cdBox').innerHTML = "<div style='color:var(--c-gold-1); font-size:1.5rem;'>HAPPY BIRTHDAY!</div>";
                return;
            }

            document.getElementById('d').innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById('h').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById('m').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById('s').innerText = Math.floor((diff % (1000 * 60)) / 1000);
        }
        setInterval(update, 1000);
        update();
    }

    // --- 4. GRID RENDER LOGIC ---
    function renderGrid(list) {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = '';
        
        let currentMonth = -1;

        list.forEach((s, index) => {
            if(s.m !== currentMonth) {
                currentMonth = s.m;
                grid.innerHTML += `
                    <div class="month-separator">
                        <span class="ms-text">${monthNames[currentMonth-1]}</span>
                        <div class="ms-line"></div>
                    </div>
                `;
            }

            const html = `
                <div class="card-student" data-tilt>
                    <img src="${s.photo}" class="cs-img" loading="lazy">
                    <div class="cs-name">${s.name}</div>
                    <div class="cs-date">${s.d} ${monthNames[s.m-1]}</div>
                </div>
            `;
            grid.innerHTML += html;
        });

        if(window.VanillaTilt) {
            VanillaTilt.init(document.querySelectorAll(".card-student"));
        }
        
        gsap.from(".card-student", {
            y: 30, opacity: 0, duration: 0.6, stagger: 0.05, ease: "power2.out"
        });
    }

    // --- 5. SEARCH FILTER ---
    function filterStudents() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const filtered = sortedStudents.filter(s => s.name.toLowerCase().includes(term));
        renderGrid(filtered);
    }

    // --- 6. CONFETTI EFFECT ---
    function fireConfetti() {
        var duration = 3 * 1000;
        var animationEnd = Date.now() + duration;
        var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 999 };

        function randomInRange(min, max) { return Math.random() * (max - min) + min; }

        var interval = setInterval(function() {
            var timeLeft = animationEnd - Date.now();
            if (timeLeft <= 0) { return clearInterval(interval); }
            var particleCount = 50 * (timeLeft / duration);
            
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
        }, 250);
    }

    window.onload = init;
  </script>
</body>
</html>
