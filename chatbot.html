<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ORACLE AI | UNCLAIRONE</title>
    <link rel="icon" type="image/svg+xml" href="image/unclairone.png" /> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #061424;
            --c-gold: #bf953f;
            --c-gold-light: #fcf6ba;
            --glass: rgba(12, 43, 48, 0.9);
            --font-royal: 'Cinzel Decorative', cursive;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: radial-gradient(circle at top, #0c2b30 0%, #061424 100%);
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100dvh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        .chat-header {
            padding: 15px 20px; background: var(--glass);
            border-bottom: 1px solid rgba(191, 149, 63, 0.3);
            display: flex; align-items: center; gap: 15px;
            backdrop-filter: blur(15px); z-index: 100;
        }

        .header-info h1 {
            font-family: var(--font-royal); font-size: 1.1rem;
            background: linear-gradient(to right, var(--c-gold-light), var(--c-gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        #chat-window {
            flex: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 15px;
        }

        .msg-container { display: flex; flex-direction: column; max-width: 85%; animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .ai-msg { align-self: flex-start; }
        .user-msg { align-self: flex-end; }

        .bubble {
            padding: 12px 16px; border-radius: 18px; font-size: 0.95rem;
            line-height: 1.4; word-wrap: break-word;
        }

        .ai-msg .bubble { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(191, 149, 63, 0.2); border-bottom-left-radius: 2px; }
        .user-msg .bubble { background: linear-gradient(135deg, var(--c-gold), #8a6e2f); color: #000; font-weight: 600; border-bottom-right-radius: 2px; }

        .timestamp { font-size: 0.65rem; color: rgba(255,255,255,0.4); margin-top: 5px; padding: 0 5px; }

        .input-form {
            padding: 20px; background: var(--glass); border-top: 1px solid rgba(191, 149, 63, 0.2);
            display: flex; gap: 10px; backdrop-filter: blur(10px);
        }

        #user-input {
            flex: 1; background: rgba(0,0,0,0.4); border: 1px solid var(--c-gold);
            padding: 12px 20px; border-radius: 30px; color: white; outline: none;
        }

        .btn-send {
            width: 48px; height: 48px; border-radius: 50%; border: none;
            background: var(--c-gold); color: #000; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .typing { font-size: 0.8rem; color: var(--c-gold-light); display: none; margin: 10px 25px; font-style: italic; }
    </style>
</head>
<body>

    <header class="chat-header">
        <a href="index.html" style="color: var(--c-gold);"><i class="fas fa-arrow-left"></i></a>
        <img src="image/unclairone.png" width="40" height="40" style="border-radius: 50%;">
        <div class="header-info">
            <h1>ORACLE AI</h1>
            <p style="font-size: 0.6rem; color: #888;">UNCLAIRONE DIGITAL PERSONA</p>
        </div>
    </header>

    <div id="chat-window">
        <div class="msg-container ai-msg">
            <div class="bubble">Salam Solidarity! Sistem Oracle telah dioptimalkan. Ada yang bisa saya bantu? ✨</div>
        </div>
    </div>

    <div id="typingIndicator" class="typing">Oracle sedang berpikir...</div>

    <form class="input-form" id="chat-form">
        <input type="text" id="user-input" placeholder="Ketik pesan..." autocomplete="off">
        <button type="submit" class="btn-send"><i class="fas fa-paper-plane"></i></button>
    </form>

<script>
    // API Key yang benar
    const API_KEY = "AIzaSyDEFqEz8ivLnVv_GcmPjrczpMfYvVQKaM0";
    
    // Endpoint yang berhasil: v2 dengan gemini-2.5-flash
    const API_URL = `https://generativelanguage.googleapis.com/v2/models/gemini-2.5-flash:generateContent?key=${API_KEY}`;

    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const chatWindow = document.getElementById('chat-window');
    const typingIndicator = document.getElementById('typingIndicator');

    // System prompt untuk Oracle AI
    const systemPrompt = `Kamu adalah Oracle AI, asisten digital untuk UNCLAIRONE kelas 10 C.1. 
    Kamu ramah, mendukung, dan selalu menyemangati dengan slogan "Solidarity Forever". 
    Jawablah dalam bahasa Indonesia yang natural dan santai.`;

    // Untuk menyimpan riwayat percakapan (konteks)
    let conversationHistory = [];

    chatForm.onsubmit = async (e) => {
        e.preventDefault();
        const userText = userInput.value.trim();
        if (!userText) return;

        // Tampilkan pesan user
        appendMessage(userText, 'user-msg');
        userInput.value = '';
        typingIndicator.style.display = 'block';

        // Tambahkan pesan user ke riwayat
        conversationHistory.push({
            role: 'user',
            parts: [{ text: userText }]
        });

        try {
            // Siapkan konten untuk dikirim, termasuk system prompt dan riwayat
            const contents = [
                {
                    role: 'user',
                    parts: [{ text: systemPrompt }]
                },
                {
                    role: 'model',
                    parts: [{ text: "Mengerti! Saya Oracle AI, siap membantu dengan semangat Solidarity!" }]
                },
                ...conversationHistory
            ];

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    contents: contents,
                    generationConfig: {
                        temperature: 0.7,
                        topP: 0.8,
                        topK: 40,
                        maxOutputTokens: 1000,
                    },
                    safetySettings: [
                        {
                            category: "HARM_CATEGORY_HARASSMENT",
                            threshold: "BLOCK_MEDIUM_AND_ABOVE"
                        }
                    ]
                })
            });

            const data = await response.json();
            console.log("API Response:", data);

            if (data.error) {
                throw new Error(data.error.message || "API Error");
            }

            const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || 
                          "Maaf, saya tidak bisa menghasilkan respons saat ini.";

            // Tambahkan respons AI ke riwayat
            conversationHistory.push({
                role: 'model',
                parts: [{ text: aiText }]
            });

            // Batasi riwayat agar tidak terlalu panjang (misalnya 6 pesan terakhir)
            if (conversationHistory.length > 6) {
                conversationHistory = conversationHistory.slice(-6);
            }

            typingIndicator.style.display = 'none';
            appendMessage(aiText, 'ai-msg');

        } catch (error) {
            console.error("Error:", error);
            typingIndicator.style.display = 'none';

            let errorMsg = "Oracle sedang mengalami gangguan. Coba lagi nanti!";

            if (error.message.includes("429")) {
                errorMsg = "Terlalu banyak permintaan. Silakan tunggu beberapa saat.";
            } else if (error.message.includes("403")) {
                errorMsg = "Akses ditolak. Periksa API key dan restrictions.";
            }

            appendMessage(errorMsg, 'ai-msg');
        }
    };

    function appendMessage(text, type) {
        const time = new Date().toLocaleTimeString([], { 
            hour: '2-digit', 
            minute: '2-digit',
            hour12: true 
        });

        // Escape HTML dan ganti newline dengan <br>
        const safeText = text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;')
            .replace(/\n/g, '<br>');

        const html = `
            <div class="msg-container ${type}">
                <div class="bubble">${safeText}</div>
                <div class="timestamp">${time}</div>
            </div>
        `;

        chatWindow.insertAdjacentHTML('beforeend', html);
        chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: 'smooth' });
    }

    // Mengirim pesan dengan Enter
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            chatForm.dispatchEvent(new Event('submit'));
        }
    });

    // Auto-focus input
    setTimeout(() => userInput.focus(), 500);

    // Pesan pembuka
    setTimeout(() => {
        appendMessage("Salam Solidarity! Oracle AI siap membantu dengan model Gemini 2.5 Flash terbaru! ✨", 'ai-msg');
    }, 1000);
</script>

</body>
</html>
