<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 QR Code Kelas Ikonik (FINAL & SEMPURNA)</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        /* Reset dan Box Sizing Universal */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* === CSS TAMPILAN LAYAR (SCREEN VIEW) === */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f4068 0%, #151d3b 100%); 
            color: #fff;
            text-align: center;
            padding: 30px 20px; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-bottom: 25px;
            font-size: 2.2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .container {
            max-width: 550px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
        }
        input {
            padding: 12px;
            margin: 8px 0;
            width: 100%;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            background-color: rgba(255, 255, 255, 0.9);
            box-sizing: border-box;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        button {
            padding: 12px 25px;
            background: linear-gradient(45deg, #007bff, #0056b3);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        #downloadButton {
            background: linear-gradient(45deg, #1abc9c, #16a085);
        }

        /* Styling Utama QR Code Mirip Ikon */
        #qrcode-wrapper {
            position: relative;
            padding: 25px 25px 60px; 
            background: #002244; 
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            display: none; 
            flex-direction: column;
            align-items: center;
        }

        /* Teks "SCAN ME" */
        #qrcode-text {
            color: white; 
            font-weight: 700;
            font-size: 1.4em;
            padding: 10px 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: absolute; 
            bottom: 5px; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        /* Area QR Code (Canvas/Image) */
        #qrcode {
            padding: 10px; 
            background: #ffffff; 
            border-radius: 10px;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            margin-bottom: 0;
        }
        
        /* Segitiga Ekor Bubble */
        #qrcode::after {
            content: '';
            position: absolute;
            bottom: -20px; 
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 20px solid #ffffff; 
            z-index: 4; 
        }
        
        /* [FIX LOGO CSS: UKURAN 100px] */
        #qrcode-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); 
            width: 100px; 
            height: 100px; 
            border-radius: 50%; 
            background-color: rgba(255, 255, 255, 0.95); 
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
            z-index: 8; 
            box-shadow: 0 0 10px rgba(0,0,0,0.4); 
        }
        /* [FIX KRITIS: MENGISI LINGKARAN PENUH] */
        #qrcode-logo img {
            width: 100%; 
            height: 100%; 
            object-fit: cover; /* KRITIS: Memotong gambar agar menutupi seluruh area */
        }

        /* ---- Bingkai Pemindai (Warna Kuning Emas) ---- */
        .scanner-frame { position: absolute; top: 5px; left: 5px; right: 5px; bottom: 5px; pointer-events: none; z-index: 6; }
        .scanner-frame::before { content: ''; position: absolute; top: 0; left: 0; width: 20px; height: 20px; border-top: 3px solid #ffcc00; border-left: 3px solid #ffcc00; border-top-left-radius: 5px; }
        .scanner-frame::after { content: ''; position: absolute; top: 0; right: 0; width: 20px; height: 20px; border-top: 3px solid #ffcc00; border-right: 3px solid #ffcc00; border-top-right-radius: 5px; }
        #qrcode-wrapper .scanner-frame > div::before { content: ''; position: absolute; bottom: 0; left: 0; width: 20px; height: 20px; border-bottom: 3px solid #ffcc00; border-left: 3px solid #ffcc00; border-bottom-left-radius: 5px; }
        #qrcode-wrapper .scanner-frame > div::after { content: ''; position: absolute; bottom: 0; right: 0; width: 20px; height: 20px; border-bottom: 3px solid #ffcc00; border-right: 3px solid #ffcc00; border-bottom-right-radius: 5px; }
        
        /* Media Query untuk Cetak */
        @media print {
            h1, .container input, .button-group { display: none; }
            body { background: #ffffff; color: #000000; padding: 0; justify-content: center; align-items: center; min-height: auto; }
            .container { width: auto; max-width: none; background: none; box-shadow: none; backdrop-filter: none; border: none; padding: 0; margin: 0 auto; }
            #qrcode-wrapper { 
                display: flex; background: #ffffff; border: 4px solid #1f4068; border-radius: 15px; padding: 20px 20px 50px; box-shadow: none; transform: none; margin: 20px; 
            }
            #qrcode { background: #ffffff; box-shadow: none; padding: 10px; border-radius: 10px; }
            #qrcode-text { color: #1f4068; text-shadow: none; bottom: 5px; font-size: 1.2em; font-weight: bold; }
            #qrcode::after { content: none; }
            .scanner-frame::before, .scanner-frame::after, #qrcode-wrapper .scanner-frame > div::before, #qrcode-wrapper .scanner-frame > div::after {
                border-color: #ffcc00 !important; border-width: 3px !important; 
            }
            #qrcode-logo { background-color: #ffffff; box-shadow: none; border: 1px solid #ddd; }
        }
    </style>
</head>
<body>
    <h1>🌟 QR Code Kelas Ikonik Generator</h1>
    <div class="container">
        <input type="text" id="text" placeholder="Masukkan URL (HARUS URL untuk 'Open Link')" value="https://www.google.com">
        <input type="text" id="displayText" placeholder="Teks Tampilan (Contoh: SCAN ME!)" value="SCAN ME">
        
        <div class="button-group">
            <button onclick="generateQR()">Buat QR Code</button>
            <button id="downloadButton" style="display: none;" onclick="downloadQR()">Unduh PNG Bergaya</button>
        </div>

        <div id="qrcode-wrapper">
            <div id="qrcode">
                <div class="scanner-frame">
                    <div></div>
                </div>
                <div id="qrcode-logo">
                    <img src="unclairone.jpg" alt="UNCLARAIONE Smart On Logo">
                </div>
            </div>
            <div id="qrcode-text"></div>
        </div>
    </div>

    <script>
        let qrCodeInstance = null;
        const qrcodeWrapper = document.getElementById('qrcode-wrapper');
        const downloadBtn = document.getElementById('downloadButton');
        const qrcodeTextElement = document.getElementById('qrcode-text');

        const DEFAULT_SIZE = 256; 
        const DEFAULT_FG_COLOR = '#1f4068'; 
        const DEFAULT_BG_COLOR = '#ffffff'; 

        function generateQR() {
            const text = document.getElementById('text').value.trim();
            const displayText = document.getElementById('displayText').value.trim() || 'SCAN ME'; 

            if (text === '') {
                alert('Tolong masukkan URL terlebih dahulu!');
                return;
            }

            document.getElementById('qrcode').innerHTML = '';
            
            // 1. Tambahkan Bingkai Scanner
            const frame = document.createElement('div');
            frame.className = 'scanner-frame';
            const innerDiv = document.createElement('div');
            frame.appendChild(innerDiv);
            document.getElementById('qrcode').appendChild(frame);

            // 2. Tambahkan Logo
            const logoDiv = document.createElement('div');
            logoDiv.id = 'qrcode-logo';
            const logoImg = document.createElement('img');
            // [FIX JALUR GAMBAR]
            logoImg.src = "unclairone.jpg"; 
            logoImg.alt = "UNCLARAIONE Smart On Logo";
            logoDiv.appendChild(logoImg);
            document.getElementById('qrcode').appendChild(logoDiv);

            // 3. Generate QR Code
            qrCodeInstance = new QRCode(document.getElementById('qrcode'), {
                text: text,
                width: DEFAULT_SIZE,
                height: DEFAULT_SIZE,
                colorDark: DEFAULT_FG_COLOR, 
                colorLight: DEFAULT_BG_COLOR,
                correctLevel: QRCode.CorrectLevel.H 
            });

            qrcodeTextElement.textContent = displayText.toUpperCase();
            qrcodeWrapper.style.display = 'flex';
            downloadBtn.style.display = 'inline-block';
        }

        // Fungsi Download menggunakan html2canvas
        async function downloadQR() {
            if (!qrCodeInstance) {
                alert('Buat QR Code terlebih dahulu sebelum mengunduh!');
                return;
            }
            
            downloadBtn.style.display = 'none';

            // Ambil Screenshot dari SELURUH KOTAK (#qrcode-wrapper)
            await html2canvas(qrcodeWrapper, {
                useCORS: true, 
                backgroundColor: null, 
                scale: 3 
            }).then(function(canvas) {
                const dataUrl = canvas.toDataURL("image/png");
                const a = document.createElement('a');
                a.href = dataUrl;
                a.download = `qrcode_kelas_unclairone_${Date.now()}.png`; 
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                downloadBtn.style.display = 'inline-block';
            }).catch(error => {
                console.error("Gagal mengunduh gambar:", error);
                alert("Terjadi kesalahan saat mencoba mengunduh QR Code.");
                downloadBtn.style.display = 'inline-block'; 
            });
        }
        
        window.onload = generateQR;
    </script>
</body>
</html>
